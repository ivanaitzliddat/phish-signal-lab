[project]
name = "phish-signal-lab"
version = "0.1.0"
description = "Reproducible evaluation of URL-only phishing risk signals"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
phish-signal = "phish_signal_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish_signal_lab"]
